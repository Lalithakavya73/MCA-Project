
<!DOCTYPE html> 
<html> 
<head> 
  <title>Live Map - Black Spot Prediction</title> 
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initialscale=1.0" /> 
 
  <!-- Leaflet CSS (no integrity, no crossorigin) --> 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /> 
 <style> 
    #map { 
      height: 100vh; 
      width: 100%; 
    } 
  </style> 
</head> 
<body>  
<div id="map"></div> 
 
<!-- Leaflet JS (no integrity, no crossorigin) --> 
<script 
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"> 
</script> 
 
<script> 
  // Initialize map 
  const map = L.map("map").setView([17.776279, 83.349832], 12.2); 
 
  // Add OpenStreetMap tiles 
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { 
    attribution: "&copy; OpenStreetMap contributors" 
  }).addTo(map); 
 
  // Optional user location 
  if (navigator.geolocation) { 
    navigator.geolocation.getCurrentPosition((position) => { 
      const lat = position.coords.latitude; 
      const lng = position.coords.longitude; 
 
      map.setView([lat, lng], 14); 
 
      L.marker([lat, lng]) 
        .addTo(map) 
        .bindPopup("      You are here") 
        .openPopup(); 
    }); 
  } 
 
  // Dummy black spot markers 
  const blackSpots = [ 
    { lat: 17.809115, lng: 83.355470, label: "Black Spot 1" }, 
    { lat: 17.724577, lng: 83.307326, label: "Black Spot 2" } ]; 
 
  blackSpots.forEach((spot) => { 
    L.marker([spot.lat, spot.lng]) 
      .addTo(map) 
      .bindPopup("     " + spot.label); 
  }); 
  </script>
</body> 
</html>
