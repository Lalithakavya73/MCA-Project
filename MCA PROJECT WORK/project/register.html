<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Black Spot App </title>

<style>
  body {
    background: linear-gradient(135deg,#dbeafe,#fef9c3);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .form-container {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 400px;
  }

  h2 { 
    text-align: center; 
    margin-bottom:25px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size:15px;
    box-sizing:border-box;
  }

  .input-group{
    display:flex;
    gap:8px;
  }

  .input-group input:first-child{
    width:80px
  }

  .captcha-group{
    display: flex;
    align-items: center;
  }

  .captcha-box{
    background: #f0f0f0;
    padding: 10px 15px;
    border: 1px dashed #999;
    font-weight: bold;
    border-radius: 6px;
    margin-right:10px;
    min-width: 80px;
    text-align:center;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover:enabled{
     background: #0056b3;
  }

  .message {
    text-align: center;
    margin-top: 10px;
  }

  .success{color: green;}
  .error{color:red;}

  .password-wrapper{
    position:relative;
  }

  .password-wrapper input{
    padding-right:40px;
  }

  .toggle-password{
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
  }

  .login-link {
    text-align: center;
    margin-top: 15px;
  }

  .login-link a {
    color: #007bff;
    text-decoration: none;
    font-weight: 500;
  }

  .login-link a:hover {
    text-decoration: underline;
  }
</style>
</head>

<body>

<div class="form-container">
  <h2>Create Account</h2>

  <form onsubmit="return verifyOTP(event)">
<input type="email" id="email" placeholder="Email" required>

<div class="password-wrapper">
<input type="password" id="password" placeholder="Password" required>
<span class="toggle-password" onclick="togglePassword()"></span>
</div>

<div class="input-group">
<input type="text" value="+91" readonly>
<input type="text" id="phone" placeholder="Phone Number" maxlength="10" required>
</div>

<div class="captcha-group">
<div class="captcha-box" id="captchaText"></div>
<input type="text" id="captchaInput" placeholder="Enter Captcha" required>
</div>

<button type="button" onclick="sendOTP()">Send OTP</button>

<input type="text" id="otp" placeholder="Enter OTP" style="display:none;">
<button type="submit" id="registerBtn" style="display:none;">Register</button>

  <p id="message" class="message"></p>

  <!-- ✅ Added Login Link -->
  <div class="login-link">
    Already registered? <a href="login.html">Login here</a>
  </div>
  </form>

</div>

<script>

const captchaText=document.getElementById("captchaText");
const messageEl=document.getElementById("message");

function togglePassword(){
    const pwd=document.getElementById("password");
    pwd.type=pwd.type==="password"?"text":"password";
}

function generateCaptcha(){
    const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let captcha="";
    for(let i=0;i<4;i++){
        captcha+=chars[Math.floor(Math.random()*chars.length)];
    }
    captchaText.textContent=captcha;
}
generateCaptcha();

async function sendOTP(){
    const phone=document.getElementById("phone").value.trim();
    const captchaInput=document.getElementById("captchaInput").value.trim();

    if(captchaInput!==captchaText.textContent){
        messageEl.textContent="Captcha incorrect!";
        messageEl.className="message error";
        generateCaptcha();
        return;
    }

    if(!/^\d{10}$/.test(phone)){
        messageEl.textContent="Enter valid 10-digit phone!";
        messageEl.className="message error";
        return;
    }

    messageEl.textContent="OTP sent (demo mode)";
    messageEl.className="message success";

    document.getElementById("otp").style.display="block";
    document.getElementById("registerBtn").style.display="block";
}

function verifyOTP(event){
    event.preventDefault();

    const otp=document.getElementById("otp").value;
    if(otp==="1234"){   // demo OTP

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      localStorage.setItem("userEmail", email);
      localStorage.setItem("userPassword", password);

        messageEl.textContent="Registered Successfully!";
        messageEl.className="message success";

        setTimeout(()=>{
          window.location.href="login.html";
        },2000);
    }else{
        messageEl.textContent="Invalid OTP!";
        messageEl.className="message error";
    }
}
</script>

</body>
</html>
