<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Map | Black Spot Prediction</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .map-form {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 999;
      width: 260px;
    }

    .map-form h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .map-form input,
    .map-form button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .map-form button {
      background-color: #007bff;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .map-form button:hover {
      background-color: #0056b3;
    }

    .swap-btn {
      text-align: center;
      cursor: pointer;
      margin: 5px 0;
    }

    .swap-btn span {
      font-size: 20px;
      user-select: none;
    }

    .distance-time {
      margin-top: 10px;
      font-weight: bold;
      color: green;
    }

    /* ✅ Blackspot Table Styling */
    #blackspotAutoTable {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 400px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      padding: 10px;
      z-index: 999;
      display: none;
    }

    #blackspotAutoTable h3 {
      margin: 0;
      font-size: 16px;
      text-align: left;
    }

    #routeSummary {
      text-align: center;
      margin: 8px 0 10px 0;
      font-weight: bold;
      font-size: 14px;
    }

    .scroll-table {
      max-height: 160px;
      overflow-y: auto;
    }

    .scroll-table table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
    }

    .scroll-table thead {
      background-color: #f0f0f0;
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    .scroll-table tbody {
      display: block;
      max-height: 130px;
      overflow-y: auto;
      width: 100%;
    }

    .scroll-table th, .scroll-table td {
      padding: 6px;
      border: 1px solid #ccc;
      text-align: left;
    }

    .scroll-table td:nth-child(2),
    .scroll-table th:nth-child(2) {
      width: 90px;
      white-space: nowrap;
    }

    .scroll-table td:nth-child(3),
    .scroll-table th:nth-child(3) {
      width: 120px;
      white-space: nowrap;
    }

    .scroll-table tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
</head>
<body>

  <div class="map-form">
    <h2>Enter Route</h2>
    <input type="text" id="startPlace" placeholder="Arrival (e.g., Hyderabad)" />
    <div class="swap-btn" onclick="swapPlaces()"><span>⇅</span></div>
    <input type="text" id="endPlace" placeholder="Destination (e.g., Visakhapatnam)" />
    <button onclick="geocodeAndShowRoute()">Show Route & Black Spots</button>
    <div id="distanceTime" class="distance-time"></div>
  </div>

  <div id="map"></div>

  <!-- ✅ Blackspot List Box -->
  <div id="blackspotAutoTable">
    <h3>Blackspot List</h3>
    <div id="routeSummary">
      <span style="color:red;">●</span> <span id="srcName">Source</span>
      &nbsp;----->&nbsp;
      <span style="color:green;">●</span> <span id="dstName">Destination</span>
    </div>

    <div class="scroll-table">
      <table>
        <thead>
          <tr>
            <th>Blackspot</th>
            <th>Date</th>
            <th>Lat, Lng</th>
          </tr>
        </thead>
        <tbody id="autoTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let map, control;

    function capitalizeWords(str) {
      return str.replace(/\b\w/g, c => c.toUpperCase());
    }

    window.onload = function () {
      map = L.map("map").setView([17.385044, 78.486671], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    };

    function swapPlaces() {
      const start = document.getElementById("startPlace").value;
      const end = document.getElementById("endPlace").value;
      document.getElementById("startPlace").value = end;
      document.getElementById("endPlace").value = start;
    }

    async function getCoordinates(place) {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`);
      const data = await response.json();
      if (data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      alert(`Location not found: ${place}`);
      return null;
    }

    async function geocodeAndShowRoute() {
      const startName = document.getElementById("startPlace").value;
      const endName = document.getElementById("endPlace").value;
      const startCoords = await getCoordinates(startName);
      const endCoords = await getCoordinates(endName);
      if (!startCoords || !endCoords) return;

      document.getElementById("srcName").innerText = capitalizeWords(startName);
      document.getElementById("dstName").innerText = capitalizeWords(endName);

      if (map) map.remove();
      map = L.map("map").setView(startCoords, 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      control = L.Routing.control({
        waypoints: [L.latLng(startCoords[0], startCoords[1]), L.latLng(endCoords[0], endCoords[1])],
        routeWhileDragging: false,
        createMarker: () => null
      }).addTo(map);

      control.on('routesfound', function(e) {
        const route = e.routes[0];
        const coords = route.coordinates;

        const dist = (route.summary.totalDistance / 1000).toFixed(2);
        const time = Math.round(route.summary.totalTime / 60);
        document.getElementById("distanceTime").innerHTML = `Distance: ${dist} km<br>Time: ${time} min`;

        L.polyline(coords, {
          color: 'red',
          weight: 6,
          opacity: 0.8
        }).addTo(map);

        const messages = [
          "⚠️ Prone Accident Area",
          "🏫 School Zone - Drive Slow",
          "⚠️ Long Curve Ahead",
          "🔄 Sharp Turning Point",
          "🚧 Under Maintenance",
          "💧 Slippery Road in Monsoon",
          "⛔ Blind Spot - Limited Visibility",
          "🚸 Pedestrian Crossing Zone"
        ];

        const aiTips = [
          "Slow down — this curve has sharp edges.",
          "Stay alert for pedestrians crossing nearby.",
          "Maintain speed below 40 km/h on this stretch.",
          "Use low beam at night in this zone.",
          "Avoid overtaking — narrow lane ahead.",
          "Road may be slippery during rain — drive carefully."
        ];

        const tableBody = document.getElementById("autoTableBody");
        tableBody.innerHTML = "";
        let lastMarkerCoords = null;
        let msgIndex = 0;
        let addedCount = 0;

        coords.forEach((point, idx) => {
          if (idx > 10 && idx % 50 === 0) {
            if (!lastMarkerCoords || map.distance(point, lastMarkerCoords) > 2000) {
              const lat = point.lat.toFixed(6);
              const lng = point.lng.toFixed(6);
              const message = messages[msgIndex % messages.length];
              const ai = aiTips[msgIndex % aiTips.length];
              const date = `2026-${1 + (msgIndex % 2)}-${3 + (msgIndex % 10)}`;

              L.marker([point.lat, point.lng], {
                icon: L.icon({
                  iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
                  iconSize: [25, 25]
                })
              }).addTo(map).bindPopup(`
                <b>${message}</b><br>
                <b>Latitude:</b> ${lat}<br>
                <b>Longitude:</b> ${lng}<br>
                💡 <b>Tip:</b> ${ai}<br><br>
                📷 <i>Reported on ${date}</i><br>
                <button onclick="showReason('${message}', ${lat}, ${lng}, ${msgIndex})"
                  style="margin-top:6px;padding:5px 10px;font-size:14px;border:none;background:#222;color:white;border-radius:5px;cursor:pointer;">
                  🧠 Show Reason
                </button>
              `);

              const row = document.createElement("tr");
              row.innerHTML = `
                <td>${message}</td>
                <td>${date}</td>
                <td>${lat}, ${lng}</td>
              `;
              tableBody.appendChild(row);
              document.getElementById("blackspotAutoTable").style.display = "block";

              lastMarkerCoords = point;
              msgIndex++;
              addedCount++;
            }
          }
        });

        if (addedCount === 0) {
          document.getElementById("blackspotAutoTable").style.display = "none";
        }
      });
    }

    function showReason(message, lat, lng, index) {
      let reason = "No specific reason found.";
      if (message.includes("School")) reason = `This area is marked as a School Zone because a school exists nearby.`;
      else if (message.includes("Curve")) reason = `Long curve detected with an angle over 38°.`;
      else if (message.includes("Sharp")) reason = `Sharp turn detected with tight radius.`;
      else if (message.includes("Prone")) reason = `Based on accident history, this is a prone area.`;
      else if (message.includes("Slippery")) reason = `Road may be slippery during monsoon.`;
      else if (message.includes("Blind")) reason = `Limited visibility curve — marked as blind spot.`;
      else if (message.includes("Crossing")) reason = `Pedestrian crossing due to nearby schools/markets.`;
      alert(`🧠 Reason for ${message}\n\n${reason}`);
    }
  </script>
</body>
</html>
